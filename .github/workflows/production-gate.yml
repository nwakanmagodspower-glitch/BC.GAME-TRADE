name: Production Gate

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gate
          POSTGRES_PASSWORD: gatepass
          POSTGRES_DB: bcgame_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gate -d bcgame_gate"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://gate:gatepass@127.0.0.1:5432/bcgame_gate
      SIGNAL_MODE: PAPER
      SIGNALS_ENABLED: 'false'
      BROADCASTS_ENABLED: 'false'
      DEFAULT_PAIR: BTCUSDT
      DEFAULT_PRODUCT: BC_UPDOWN
      DEFAULT_EXPIRY_SECONDS: '300'
      STRATEGY_VERSION: BTC_UPDOWN_V1.0

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q

      - name: Apply all migrations to PostgreSQL
        run: alembic upgrade head

      - name: Verify migration head
        run: alembic current

      - name: Assert safe release defaults
        run: |
          python - <<'PY'
          from app.core.config import get_settings
          from app.core.startup import validate_settings
          s = get_settings()
          assert s.signal_mode == 'PAPER'
          assert s.signals_enabled is False
          assert s.broadcasts_enabled is False
          assert s.default_pair == 'BTCUSDT'
          assert s.default_product == 'BC_UPDOWN'
          assert s.default_expiry_seconds == 300
          assert s.strategy_version.startswith('BTC_UPDOWN_V1')
          result = validate_settings(s)
          assert result.ok, result.errors
          print('Safe release defaults verified.')
          PY

      - name: Validate production fail-closed contract
        run: |
          python - <<'PY'
          from app.core.config import Settings
          from app.core.startup import validate_settings
          bad = Settings(_env_file=None, app_env='production', database_url='sqlite:///bad.db')
          result = validate_settings(bad)
          assert not result.ok
          print('Invalid production configuration correctly rejected.')
          PY

      - name: Validate production-like configuration contract
        run: |
          python - <<'PY'
          from app.core.config import Settings
          from app.core.startup import validate_settings
          good = Settings(
              _env_file=None,
              app_env='production',
              database_url='postgresql+psycopg://gate:gatepass@127.0.0.1:5432/bcgame_gate',
              telegram_bot_token='test-token',
              telegram_webhook_secret='0123456789abcdef0123456789abcdef',
              owner_telegram_id=1,
              admin_chat_id=2,
              bcgame_registration_url='https://example.com/register',
              bcgame_deposit_url='https://example.com/deposit',
              bcgame_updown_url='https://example.com/updown',
              support_url='https://example.com/support',
          )
          result = validate_settings(good)
          assert result.ok, result.errors
          print('Production-like configuration contract verified.')
          PY
