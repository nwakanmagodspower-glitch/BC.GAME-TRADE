services:
  - type: web
    name: bcgame-trade-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bcgame-trade-db
          property: connectionString
      - key: SIGNAL_MODE
        value: PAPER
      - key: SIGNALS_ENABLED
        value: "false"
      - key: DEFAULT_PAIR
        value: BTCUSDT
      - key: DEFAULT_EXPIRY_SECONDS
        value: "300"
      - key: STRATEGY_VERSION
        value: BTC_UPDOWN_V1.0
      - key: MARKET_DATA_MAX_AGE_SECONDS
        value: "3"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: BCGAME_REGISTRATION_URL
        sync: false
      - key: BCGAME_DEPOSIT_URL
        sync: false
      - key: SUPPORT_URL
        sync: false

databases:
  - name: bcgame-trade-db
    plan: basic-256mb
