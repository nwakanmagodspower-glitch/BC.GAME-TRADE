services:
  - type: web
    name: bcgame-trade-api
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bcgame-trade-db
          property: connectionString
      - key: SIGNAL_MODE
        value: PAPER
      - key: SIGNALS_ENABLED
        value: "false"
      - key: BROADCASTS_ENABLED
        value: "false"
      - key: DEFAULT_PAIR
        value: BTCUSDT
      - key: DEFAULT_PRODUCT
        value: BC_UPDOWN
      - key: DEFAULT_EXPIRY_SECONDS
        value: "300"
      - key: STRATEGY_VERSION
        value: BTC_UPDOWN_V1.0
      - key: MARKET_DATA_PROVIDER
        value: BINANCE_SPOT
      - key: MARKET_DATA_REST_BASE_URL
        value: https://api.binance.com
      - key: MARKET_DATA_WS_BASE_URL
        value: wss://stream.binance.com:9443/ws
      - key: MARKET_DATA_MAX_AGE_SECONDS
        value: "3"
      - key: MARKET_DATA_RECONNECT_SECONDS
        value: "3"
      - key: MARKET_DATA_KLINE_LIMIT
        value: "300"
      - key: TEMPORARY_RETENTION_DAYS
        value: "10"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "86400"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: BCGAME_REGISTRATION_URL
        sync: false
      - key: BCGAME_DEPOSIT_URL
        sync: false
      - key: BCGAME_UPDOWN_URL
        sync: false
      - key: SUPPORT_URL
        sync: false

  - type: worker
    name: bcgame-trade-worker
    runtime: docker
    plan: starter
    region: frankfurt
    dockerCommand: python -m app.worker
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bcgame-trade-db
          property: connectionString
      - key: SIGNAL_MODE
        value: PAPER
      - key: SIGNALS_ENABLED
        value: "false"
      - key: BROADCASTS_ENABLED
        value: "false"
      - key: DEFAULT_PAIR
        value: BTCUSDT
      - key: DEFAULT_PRODUCT
        value: BC_UPDOWN
      - key: DEFAULT_EXPIRY_SECONDS
        value: "300"
      - key: STRATEGY_VERSION
        value: BTC_UPDOWN_V1.0
      - key: MARKET_DATA_PROVIDER
        value: BINANCE_SPOT
      - key: MARKET_DATA_REST_BASE_URL
        value: https://api.binance.com
      - key: MARKET_DATA_WS_BASE_URL
        value: wss://stream.binance.com:9443/ws
      - key: MARKET_DATA_MAX_AGE_SECONDS
        value: "3"
      - key: MARKET_DATA_RECONNECT_SECONDS
        value: "3"
      - key: MARKET_DATA_KLINE_LIMIT
        value: "300"
      - key: TEMPORARY_RETENTION_DAYS
        value: "10"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "86400"
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_WEBHOOK_SECRET
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: TELEGRAM_WEBHOOK_SECRET
      - key: OWNER_TELEGRAM_ID
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: OWNER_TELEGRAM_ID
      - key: ADMIN_CHAT_ID
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: ADMIN_CHAT_ID
      - key: BCGAME_REGISTRATION_URL
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: BCGAME_REGISTRATION_URL
      - key: BCGAME_DEPOSIT_URL
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: BCGAME_DEPOSIT_URL
      - key: BCGAME_UPDOWN_URL
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: BCGAME_UPDOWN_URL
      - key: SUPPORT_URL
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: SUPPORT_URL

databases:
  - name: bcgame-trade-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
