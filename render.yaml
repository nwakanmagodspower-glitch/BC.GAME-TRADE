services:
  - type: web
    name: bcgame-trade-api
    runtime: docker
    branch: main
    autoDeployTrigger: commit
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    maxShutdownDelaySeconds: 60
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_BACKGROUND_JOBS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: bcgame-trade-db
          property: connectionString
      - key: SIGNAL_MODE
        value: LIVE
      - key: SIGNALS_ENABLED
        value: "true"
      - key: BROADCASTS_ENABLED
        value: "true"
      - key: SIGNAL_TIMING_MODE
        value: HYBRID_SYNC
      - key: GAME_MARKET
        value: BTC/USD
      - key: ANALYSIS_PAIR
        value: BTCUSDT
      - key: DEFAULT_PAIR
        value: BTCUSDT
      - key: DEFAULT_PRODUCT
        value: BC_UPDOWN_5S
      - key: DEFAULT_EXPIRY_SECONDS
        value: "5"
      - key: DEFAULT_STAKE_BAND
        value: "1-50"
      - key: STRATEGY_VERSION
        value: BTC_UPDOWN_5S_V1.1
      - key: BCGAME_ROUND_SYNC_ENABLED
        value: "true"
      - key: BCGAME_ROUND_SYNC_MAX_AGE_SECONDS
        value: "2"
      - key: DETRADE_WS_ENABLED
        value: "true"
      - key: DETRADE_WS_TOKEN
        value: temporary
      - key: DETRADE_AUTH_MODE
        value: QUERY
      - key: DETRADE_WS_URL
        value: wss://websocket.detrade.com/ws
      - key: DETRADE_ORIGIN
        value: https://bc.game
      - key: DETRADE_DEVICE
        value: web-pc
      - key: DETRADE_CLIENT_TYPE
        value: "1"
      - key: DETRADE_SUBSCRIPTION_CMD
        value: /contest/BTC/USD/5/ticker/subscribe
      - key: DETRADE_TICKER_ROUTE
        value: /contest/BTC/USD/5/ticker
      - key: DETRADE_LATENCY_SAFETY_MARGIN_MS
        value: "7000"
      - key: DETRADE_DISPATCH_MIN_REMAINING_MS
        value: "4500"
      - key: DETRADE_STALE_AFTER_MS
        value: "1500"
      - key: DETRADE_PROBE_TIMEOUT_SECONDS
        value: "2.5"
      - key: DETRADE_RECONNECT_SECONDS
        value: "2"
      - key: DETRADE_RECONNECT_MAX_SECONDS
        value: "30"
      - key: DETRADE_MAX_FRAME_BYTES
        value: "1000000"
      - key: SIGNAL_MIN_SCORE
        value: "6"
      - key: SIGNAL_MIN_MARGIN
        value: "3"
      - key: SIGNAL_TRADE_FLOW_LOOKBACK_SECONDS
        value: "15"
      - key: SIGNAL_SCAN_COALESCE_MS
        value: "250"
      - key: SIGNAL_USER_COOLDOWN_SECONDS
        value: "5"
      - key: SIGNAL_MIN_RECENT_TRADES
        value: "12"
      - key: SIGNAL_MIN_TICK_SPAN_SECONDS
        value: "4"
      - key: SIGNAL_SETTLEMENT_WINDOW_SECONDS
        value: "2"
      - key: WORKER_HEARTBEAT_MAX_AGE_SECONDS
        value: "30"
      - key: MARKET_DATA_PROVIDER
        value: BINANCE_SPOT
      - key: MARKET_DATA_REST_BASE_URL
        value: https://api.binance.com
      - key: MARKET_DATA_WS_BASE_URL
        value: wss://stream.binance.com:9443/ws
      - key: MARKET_DATA_MAX_AGE_SECONDS
        value: "2"
      - key: MARKET_DATA_RECONNECT_SECONDS
        value: "3"
      - key: MARKET_DATA_KLINE_LIMIT
        value: "120"
      - key: MARKET_CANDLE_REFRESH_SECONDS
        value: "15"
      - key: MARKET_CANDLE_MAX_AGE_SECONDS
        value: "60"
      - key: MARKET_DATA_REST_MAX_RESPONSE_BYTES
        value: "1000000"
      - key: MARKET_DATA_FUTURE_SKEW_SECONDS
        value: "2"
      - key: VERIFICATION_MAX_DEPOSIT_PROOFS
        value: "3"
      - key: VERIFICATION_MAX_PHOTO_BYTES
        value: "10000000"
      - key: VERIFICATION_MIN_EVIDENCE_INTERVAL_SECONDS
        value: "0.5"
      - key: VERIFICATION_DELIVERY_MAX_ATTEMPTS
        value: "5"
      - key: TELEGRAM_WEBHOOK_MAX_BODY_BYTES
        value: "1000000"
      - key: TELEGRAM_UPDATE_PROCESSING_TIMEOUT_SECONDS
        value: "60"
      - key: TELEGRAM_WEBHOOK_MAX_CONCURRENCY
        value: "32"
      - key: TELEGRAM_WEBHOOK_QUEUE_TIMEOUT_SECONDS
        value: "0.25"
      - key: TELEGRAM_USER_UPDATE_LIMIT
        value: "30"
      - key: TELEGRAM_USER_UPDATE_WINDOW_SECONDS
        value: "10"
      - key: TEMPORARY_RETENTION_DAYS
        value: "10"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "86400"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
      - key: BCGAME_REGISTRATION_URL
        sync: false
      - key: BCGAME_DEPOSIT_URL
        sync: false
      - key: BCGAME_UPDOWN_URL
        sync: false
      - key: SUPPORT_URL
        sync: false

  - type: worker
    name: bcgame-trade-worker
    runtime: docker
    branch: main
    autoDeployTrigger: commit
    plan: starter
    region: frankfurt
    maxShutdownDelaySeconds: 60
    dockerCommand: python -m app.worker
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_BACKGROUND_JOBS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: bcgame-trade-db
          property: connectionString
      - key: SIGNAL_MODE
        value: LIVE
      - key: SIGNALS_ENABLED
        value: "true"
      - key: BROADCASTS_ENABLED
        value: "true"
      - key: SIGNAL_TIMING_MODE
        value: HYBRID_SYNC
      - key: GAME_MARKET
        value: BTC/USD
      - key: ANALYSIS_PAIR
        value: BTCUSDT
      - key: DEFAULT_PAIR
        value: BTCUSDT
      - key: DEFAULT_PRODUCT
        value: BC_UPDOWN_5S
      - key: DEFAULT_EXPIRY_SECONDS
        value: "5"
      - key: DEFAULT_STAKE_BAND
        value: "1-50"
      - key: STRATEGY_VERSION
        value: BTC_UPDOWN_5S_V1.1
      - key: BCGAME_ROUND_SYNC_ENABLED
        value: "true"
      - key: BCGAME_ROUND_SYNC_MAX_AGE_SECONDS
        value: "2"
      - key: SIGNAL_MIN_SCORE
        value: "6"
      - key: SIGNAL_MIN_MARGIN
        value: "3"
      - key: SIGNAL_TRADE_FLOW_LOOKBACK_SECONDS
        value: "15"
      - key: SIGNAL_SCAN_COALESCE_MS
        value: "250"
      - key: SIGNAL_USER_COOLDOWN_SECONDS
        value: "5"
      - key: SIGNAL_MIN_RECENT_TRADES
        value: "12"
      - key: SIGNAL_MIN_TICK_SPAN_SECONDS
        value: "4"
      - key: SIGNAL_SETTLEMENT_WINDOW_SECONDS
        value: "2"
      - key: WORKER_HEARTBEAT_MAX_AGE_SECONDS
        value: "30"
      - key: MARKET_DATA_PROVIDER
        value: BINANCE_SPOT
      - key: MARKET_DATA_REST_BASE_URL
        value: https://api.binance.com
      - key: MARKET_DATA_WS_BASE_URL
        value: wss://stream.binance.com:9443/ws
      - key: MARKET_DATA_MAX_AGE_SECONDS
        value: "2"
      - key: MARKET_DATA_RECONNECT_SECONDS
        value: "3"
      - key: MARKET_DATA_KLINE_LIMIT
        value: "120"
      - key: MARKET_CANDLE_REFRESH_SECONDS
        value: "15"
      - key: MARKET_CANDLE_MAX_AGE_SECONDS
        value: "60"
      - key: MARKET_DATA_REST_MAX_RESPONSE_BYTES
        value: "1000000"
      - key: MARKET_DATA_FUTURE_SKEW_SECONDS
        value: "2"
      - key: VERIFICATION_MAX_DEPOSIT_PROOFS
        value: "3"
      - key: VERIFICATION_MAX_PHOTO_BYTES
        value: "10000000"
      - key: VERIFICATION_MIN_EVIDENCE_INTERVAL_SECONDS
        value: "0.5"
      - key: VERIFICATION_DELIVERY_MAX_ATTEMPTS
        value: "5"
      - key: TELEGRAM_WEBHOOK_MAX_BODY_BYTES
        value: "1000000"
      - key: TELEGRAM_UPDATE_PROCESSING_TIMEOUT_SECONDS
        value: "60"
      - key: TEMPORARY_RETENTION_DAYS
        value: "10"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "86400"
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_WEBHOOK_SECRET
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: TELEGRAM_WEBHOOK_SECRET
      - key: OWNER_TELEGRAM_ID
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: OWNER_TELEGRAM_ID
      - key: BCGAME_REGISTRATION_URL
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: BCGAME_REGISTRATION_URL
      - key: BCGAME_DEPOSIT_URL
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: BCGAME_DEPOSIT_URL
      - key: BCGAME_UPDOWN_URL
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: BCGAME_UPDOWN_URL
      - key: SUPPORT_URL
        fromService:
          type: web
          name: bcgame-trade-api
          envVarKey: SUPPORT_URL

databases:
  - name: bcgame-trade-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []
